function render3D() {
  const x = NEURONS.map(n => n.layer);
  const y = NEURONS.map(n => n.neuron);
  const z = NEURONS.map(n => n.abs_delta);
  const colors = NEURONS.map(n => n.delta);
  const maxDelta = Math.max.apply(null, NEURONS.map(function(n) { return n.abs_delta; }));
  const sizes = NEURONS.map(function(n) { 
    return 3 + (n.abs_delta / maxDelta) * 15;
  });
  const hoverText = NEURONS.map(function(n) {
    var label = n.delta > 0 ? 'REFUSAL' : 'support';
    return '<b>L' + n.layer + ' · N' + n.neuron + '</b> (#' + n.rank + ') [' + label + ']<br>' +
    'Δ = ' + (n.delta > 0 ? '+' : '') + n.delta.toFixed(5) + '<br>' +
    '|Δ| = ' + n.abs_delta.toFixed(5) + '<br>' +
    'Act(harmful) = ' + n.act_harmful_mean.toFixed(4) + '<br>' +
    'Act(benign) = ' + n.act_benign_mean.toFixed(4);
  });

  const trace = {
    x: x, y: y, z: z, type: 'scatter3d', mode: 'markers',
    marker: {
      size: sizes,
      color: colors,
      colorscale: [[0, '#3b82f6'], [0.35, '#8b5cf6'], [0.5, '#e2e8f0'], [0.65, '#f97316'], [1, '#ef4444']],
      opacity: 0.7,
      line: { width: 0 },
    },
    text: hoverText,
    hoverinfo: 'text',
    hovertemplate: '%{text}<extra></extra>',
  };

  Plotly.newPlot('main-chart', [trace], layout3d, { responsive: true });
}

// ---- INIT ----
render3D();
</script>
