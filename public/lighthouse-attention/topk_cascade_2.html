<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lighthouse top-K cascade</title>
<style>
  :root{
    --bg:        #f0f4f7;
    --panel:     #ffffff;
    --line:      #c5d8e3;
    --ink:       #023750;
    --muted:     #5c7d8e;

    --g0:        #dce8f0;
    --g1:        #b8d1e0;
    --g2:        #7bafc8;
    --g3:        #4a96b8;
    --g4:        #0471a9;

    --l0:        #0471a9;
    --l1:        #0589c8;
    --l2:        #58b0d4;

    --score:     #4db8d9;
    --link:      #6cabc4;
    --pick:      #ffe074;
    --reject:    #c97c5e;

    --r:         10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif;}
  html,body{height:100%;}
  .wrap{max-width:1200px;margin:8px auto;padding:0 14px;}
  h1{font:600 1.05rem/1 'Inter',sans-serif; margin:0; color:var(--ink); letter-spacing:-.01em;}
  .lede{margin:4px 0 0;color:var(--muted);font-size:.85rem;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:12px;margin:8px 0;}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;}
  .phase{font-family:JetBrains Mono,Menlo,Consolas,monospace;font-size:.78rem;color:var(--muted);
    letter-spacing:.04em;text-transform:uppercase;}
  .title{color:var(--l1);font-weight:600;font-size:1rem;margin:0;}
  svg{display:block;width:100%;height:auto;background:transparent;border-radius:8px;}
  .controls{display:flex;align-items:center;gap:10px;margin-top:14px;}
  button{appearance:none;border:1px solid var(--line);background:transparent;
    color:var(--ink);width:36px;height:36px;border-radius:8px;cursor:pointer;
    font-size:1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s ease, border-color .15s ease;}
  button:hover{background:#e8f0f5;border-color:#a8c8d8;}
  button.play{background:#e0edf5;border-color:#9ec3d5;color:var(--g4);}
  button.play:hover{background:#d0e3ef;}
  .meter{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .meter > i{display:block;height:100%;background:var(--l0);width:0;transition:width .25s ease;}
  .speed{background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font:inherit;}
  .speed:focus{outline:none;border-color:var(--l0);}
  .legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);margin-top:10px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;}
  .ring{display:inline-block;width:10px;height:10px;border-radius:2px;border:2px solid var(--pick);background:transparent;box-sizing:border-box;}
  .ring-r{display:inline-block;width:10px;height:10px;border-radius:2px;border:2px solid var(--reject);background:transparent;box-sizing:border-box;}
</style>
</head>
<body>

<div class="wrap">

  <h1>Lighthouse top-K cascade</h1>
  <p class="lede">N = 16, L = 3, p = 2, K = 2.  Coarse-to-fine descent: top-K at each level, append both selected & rejected, then sort to causal order.</p>

  <div class="panel">
    <div class="head">
      <h3 class="title" id="title">Initial pyramid</h3>
      <div class="phase" id="phase">phase 1 / 9</div>
    </div>
    <svg id="viz" viewBox="0 0 1100 460" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ah-pick" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffe074"/>
        </marker>
      </defs>
    </svg>
    <div class="controls">
      <button id="prev"  title="Previous">⟵</button>
      <button id="play"  class="play" title="Play / Pause">▶</button>
      <button id="next"  title="Next">⟶</button>
      <button id="restart" title="Restart">↻</button>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <select id="speed" class="speed">
        <option value="0.5">½×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div class="legend">
      <span><i style="background:var(--g4)"></i>L0</span>
      <span><i style="background:var(--l1)"></i>L1</span>
      <span><i style="background:var(--l2)"></i>L2</span>
      <span><i style="background:var(--score)"></i>‖·‖₂</span>
      <span><i class="ring"></i>selected (cascades)</span>
      <span><i class="ring-r"></i>rejected (kept in buffer)</span>
    </div>
  </div>

</div>

<script>
const N = 16, L = 3, p = 2, K = 2;
const SIZES = [N, N/p, N/(p*p)];                  // [16, 8, 4]
const TOTAL = SIZES.reduce((a,b)=>a+b,0);         // 28
const OFF   = [0, SIZES[0], SIZES[0]+SIZES[1]];   // [0, 16, 24]
const globalIdx = (lvl,i) => OFF[lvl] + i;        // 0..27 → labels 1..28

// Same scoring as the pool viz (seed=7).
const rng = (s=>()=>(s=(s*9301+49297)%233280)/233280)(7);
const v0 = Array.from({length:N}, () => 0.30 + rng()*0.70);
const v1 = Array.from({length:SIZES[1]}, (_,i)=>(v0[2*i]+v0[2*i+1])/2);
const v2 = Array.from({length:SIZES[2]}, (_,i)=>(v1[2*i]+v1[2*i+1])/2);
const s0 = v0.slice();
const s1 = Array.from({length:SIZES[1]}, (_,i)=>Math.max(s0[2*i],s0[2*i+1]));
const s2 = Array.from({length:SIZES[2]}, (_,i)=>Math.max(s1[2*i],s1[2*i+1]));
const valueOf = (lvl,i) => [v0,v1,v2][lvl][i];
const scoreOf = (lvl,i) => [s0,s1,s2][lvl][i];

/* ---------- cascade algorithm ---------- */
function topkOf(level, candidates, k){
  return [...candidates].sort((a,b)=>scoreOf(level,b)-scoreOf(level,a)).slice(0, k);
}

// L2: all 4 entries are candidates
const L2_cands = [0,1,2,3];
const L2_sel   = new Set(topkOf(2, L2_cands, K));
// L1 candidates = children of selected L2
const L1_cands = [];
for (const i of [...L2_sel].sort((a,b)=>a-b)) L1_cands.push(2*i, 2*i+1);
const L1_sel   = new Set(topkOf(1, L1_cands, K));
// L0 candidates = children of selected L1; all are kept (base level)
const L0_cands = [];
for (const i of [...L1_sel].sort((a,b)=>a-b)) L0_cands.push(2*i, 2*i+1);
const L0_kept  = new Set(L0_cands);

// 'selected' = top-K (cascades). 'rejected' = considered but not chosen.
// 'unused'   = never entered the cascade (parent wasn't selected).
function statusOf(lvl, i){
  if (lvl === 2) return L2_sel.has(i) ? 'selected' : 'rejected';
  if (lvl === 1){
    if (!L1_cands.includes(i)) return 'unused';
    return L1_sel.has(i) ? 'selected' : 'rejected';
  }
  if (!L0_kept.has(i)) return 'unused';
  return 'selected';
}

/* ---------- buffer fill order (cascade order) ---------- */
const bufferAppend = [
  ...L2_cands.map(i=>({lvl:2, i})),
  ...L1_cands.slice().sort((a,b)=>a-b).map(i=>({lvl:1, i})),
  ...L0_cands.slice().sort((a,b)=>a-b).map(i=>({lvl:0, i})),
];
const BUF_TOTAL = bufferAppend.length;            // 4 + 4 + 4 = 12
const APPEND_PHASE = { 2: 2, 1: 5, 0: 7 };        // when each level flies to buffer

function appendSlot(lvl, i){
  return bufferAppend.findIndex(e => e.lvl === lvl && e.i === i);
}

/* causal sort: parent comes after its unpooled children.
   sort key = (last_base_pos)*100 + lvl  →  ties broken by lvl (coarser later) */
function basePosKey(lvl, i){
  const span = Math.pow(2, lvl);
  const last = (i+1)*span - 1;
  return last*100 + lvl;
}
const sortedOrder = bufferAppend.slice().sort(
  (a,b)=>basePosKey(a.lvl,a.i) - basePosKey(b.lvl,b.i)
);
function sortedSlot(lvl, i){
  return sortedOrder.findIndex(e => e.lvl === lvl && e.i === i);
}

/* ---------- layout ---------- */
const W = 1100, H = 460, PAD = 36;
const trackW = W - 2*PAD;
const cellH = 24;
const flatGap = 2;

const pyrL2_y = 30;
const pyrL1_y = 110;
const pyrL0_y = 190;

const bufY = 380;
const bufSlotW = (trackW - (BUF_TOTAL-1)*flatGap) / BUF_TOTAL;
const bufX = (slot) => PAD + slot*(bufSlotW + flatGap);

const pyrL0_w = (trackW - (N-1)*flatGap)/N;
const pyrL0_x = i => PAD + i*(pyrL0_w + flatGap);
const pyrL1_w = 2*pyrL0_w + flatGap;
const pyrL2_w = 4*pyrL0_w + 3*flatGap;
const pyrL1_x = i => (pyrL0_x(2*i) + pyrL0_x(2*i+1)+pyrL0_w)/2 - pyrL1_w/2;
const pyrL2_x = i => (pyrL0_x(4*i) + pyrL0_x(4*i+3)+pyrL0_w)/2 - pyrL2_w/2;

function pyrBox(lvl,i){
  if (lvl===0) return {x:pyrL0_x(i), y:pyrL0_y, w:pyrL0_w, h:cellH};
  if (lvl===1) return {x:pyrL1_x(i), y:pyrL1_y, w:pyrL1_w, h:cellH};
  return         {x:pyrL2_x(i), y:pyrL2_y, w:pyrL2_w, h:cellH};
}
function bufBoxAtSlot(slot){
  return {x:bufX(slot), y:bufY, w:bufSlotW, h:cellH};
}

const RAMP = ['var(--g0)','var(--g1)','var(--g2)','var(--g3)','var(--g4)'];
function fillFor(value){
  const t = Math.min(0.999, Math.max(0, (value - 0.25) / 0.80));
  return RAMP[Math.floor(t*RAMP.length)];
}

/* ---------- phases ---------- */
const phases = [
  { title: 'Initial pyramid',                  sub: '28 entries: 16 base + 8 + 4. Buffer empty.' },
  { title: 'L2 top-K  (4 → 2)',                sub: 'Score all 4 L2 entries; top-2 selected (gold), others rejected (red).' },
  { title: 'Append L2 to buffer',              sub: 'Both selected and rejected go in (slots 1–4).' },
  { title: 'Cascade L2 → L1',                  sub: 'Each selected L2 unpools to its 2 L1 children → 4 candidates.' },
  { title: 'L1 top-K  (4 → 2)',                sub: 'Same rule: top-2 selected, others rejected.' },
  { title: 'Append L1 to buffer',              sub: 'All 4 L1 candidates appended (slots 5–8); un-cascaded L1 fade out.' },
  { title: 'Cascade L1 → L0',                  sub: 'Each selected L1 unpools to its 2 L0 children → 4 base tokens.' },
  { title: 'Append L0 to buffer',              sub: 'Base level — all 4 are kept (slots 9–12). Buffer is now 12 entries.' },
  { title: 'Sort: causal order',               sub: 'Sort by base-sequence position; parents follow their unpooled children.' },
];
const PHASE_COUNT = phases.length;

/* ---------- helpers ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text!=null) e.textContent = text;
  return e;
}
const ease = t => t<0?0 : t>1?1 : (1 - Math.cos(Math.PI*t))/2;
const lerp = (a,b,t) => a+(b-a)*t;

/* entry box position (interpolates pyramid → buffer → sorted-slot over phases) */
function entryBox(lvl, i, phase, tt){
  const status = statusOf(lvl, i);
  if (status === 'unused'){
    return pyrBox(lvl, i);
  }
  const ap = APPEND_PHASE[lvl];
  if (phase < ap) return pyrBox(lvl, i);
  if (phase === ap){
    const A = pyrBox(lvl, i);
    const B = bufBoxAtSlot(appendSlot(lvl, i));
    return {x:lerp(A.x,B.x,tt), y:lerp(A.y,B.y,tt), w:lerp(A.w,B.w,tt), h:lerp(A.h,B.h,tt)};
  }
  if (phase < 8) return bufBoxAtSlot(appendSlot(lvl, i));
  // phase 8: sort
  const A = bufBoxAtSlot(appendSlot(lvl, i));
  const B = bufBoxAtSlot(sortedSlot(lvl, i));
  return {x:lerp(A.x,B.x,tt), y:A.y, w:A.w, h:A.h};
}

function entryAlpha(lvl, i, phase, tt){
  const status = statusOf(lvl, i);
  if (status === 'unused'){
    if (phase === 0) return 1;
    const ap = APPEND_PHASE[lvl];
    if (phase < ap) return 0.4;
    if (phase === ap) return lerp(0.4, 0, tt);
    return 0;
  }
  // selected / rejected: at the level's top-K phase, smoothly dim the
  // rejected cells (1.0 -> 0.5) so the contrast with selected grows in
  // sync with the ring fade-in.  Selected stays at full alpha.
  const SEL_PHASE = lvl === 2 ? 1 : (lvl === 1 ? 4 : 7);
  const dimTo = 0.5;
  if (status === 'rejected'){
    if (phase < SEL_PHASE) return 1;
    if (phase === SEL_PHASE) return lerp(1, dimTo, tt);
    return dimTo;
  }
  return 1;  // selected
}

function ringAlpha(lvl, i, phase, tt){
  if (lvl === 2){
    if (phase < 1) return 0;
    if (phase === 1) return tt;
    return 1;
  }
  if (lvl === 1){
    if (phase < 4) return 0;
    if (phase === 4) return tt;
    return 1;
  }
  if (lvl === 0){
    if (phase < 7) return 0;
    if (phase === 7) return tt;
    return 1;
  }
  return 0;
}

function cascadeArrowAlpha(fromLvl, phase, tt){
  if (fromLvl === 2){
    if (phase < 3) return 0;
    if (phase === 3) return tt;
    if (phase === 4) return 1;
    if (phase === 5) return 1 - tt;
    return 0;
  }
  if (fromLvl === 1){
    if (phase < 6) return 0;
    if (phase === 6) return tt;
    if (phase === 7) return 1 - tt;
    return 0;
  }
  return 0;
}

/* ---------- draw ---------- */
const svg = document.getElementById('viz');
const titleEl = document.getElementById('title');
const phaseEl = document.getElementById('phase');
const meter   = document.getElementById('meter');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const restartBtn = document.getElementById('restart');
const speedSel = document.getElementById('speed');

function clearSvg(){
  const defs = svg.querySelector('defs');
  while (svg.lastChild && svg.lastChild !== defs) svg.removeChild(svg.lastChild);
}

function draw(phase, progress){
  clearSvg();
  const tt = ease(progress);

  /* buffer track outline (appears once first append starts).
     Label flips from "buffer" → "sorted sequence" during phase 8. */
  const bufFrame_a = phase >= 2 ? (phase === 2 ? Math.min(1, tt*1.4) : 1) : 0;
  if (bufFrame_a > 0.01){
    svg.appendChild(el('rect',{
      x: PAD - 8, y: bufY - 8,
      width: trackW + 16, height: cellH + 16,
      rx: 6, ry: 6,
      fill:'none', stroke:'var(--line)', 'stroke-width':1,
      opacity: bufFrame_a*0.7,
    }));
    const label = (phase >= 8) ? 'sorted sequence  (causal order)' : 'buffer';
    const labelColor = (phase >= 8) ? 'var(--l1)' : 'var(--muted)';
    svg.appendChild(el('text',{
      x: PAD - 8, y: bufY - 14,
      'font-size': 11,
      'font-family':'JetBrains Mono,Menlo,Consolas,monospace',
      fill: labelColor, opacity: bufFrame_a*0.95,
    }, label));
  }

  /* slot index labels under the sorted sequence (phase 8) */
  const slotIdx_a = phase >= 8 ? tt : 0;
  if (slotIdx_a > 0.01){
    for (let s=0; s<BUF_TOTAL; s++){
      const sx = bufX(s) + bufSlotW/2;
      svg.appendChild(el('text',{
        x: sx, y: bufY + cellH + 22,
        'text-anchor':'middle',
        'font-size': 10,
        'font-family':'JetBrains Mono,Menlo,Consolas,monospace',
        fill: 'var(--muted)', opacity: slotIdx_a*0.85,
      }, String(s+1)));
    }
  }

  /* cascade arrows (drawn from the original pyramid positions of selected parents) */
  const a_L2L1 = cascadeArrowAlpha(2, phase, tt);
  if (a_L2L1 > 0.01){
    for (const i of L2_sel){
      const A = pyrBox(2, i);
      const ax = A.x + A.w/2, ay = A.y + A.h;
      for (const j of [2*i, 2*i+1]){
        const B = pyrBox(1, j);
        const bx = B.x + B.w/2, by = B.y;
        svg.appendChild(el('path',{
          d:`M ${ax} ${ay} L ${bx} ${by}`,
          stroke:'var(--pick)', 'stroke-width':1.6, fill:'none',
          opacity: a_L2L1*0.95, 'marker-end':'url(#ah-pick)',
          'stroke-linecap':'round',
        }));
      }
    }
  }
  const a_L1L0 = cascadeArrowAlpha(1, phase, tt);
  if (a_L1L0 > 0.01){
    for (const i of L1_sel){
      const A = pyrBox(1, i);
      const ax = A.x + A.w/2, ay = A.y + A.h;
      for (const j of [2*i, 2*i+1]){
        const B = pyrBox(0, j);
        const bx = B.x + B.w/2, by = B.y;
        svg.appendChild(el('path',{
          d:`M ${ax} ${ay} L ${bx} ${by}`,
          stroke:'var(--pick)', 'stroke-width':1.6, fill:'none',
          opacity: a_L1L0*0.95, 'marker-end':'url(#ah-pick)',
          'stroke-linecap':'round',
        }));
      }
    }
  }

  /* score bars below cells (only while in pyramid) */
  for (let lvl=0; lvl<L; lvl++){
    for (let i=0;i<SIZES[lvl];i++){
      const status = statusOf(lvl, i);
      let barAlpha;
      if (status === 'unused'){
        barAlpha = entryAlpha(lvl, i, phase, tt);
      } else {
        // bar tracks the cell's own alpha (so rejected dims with the cell)
        // and additionally fades out as the cell flies into the buffer.
        const ap = APPEND_PHASE[lvl];
        const cellA = entryAlpha(lvl, i, phase, tt);
        if (phase < ap) barAlpha = cellA;
        else if (phase === ap) barAlpha = cellA * (1 - tt);
        else barAlpha = 0;
      }
      if (barAlpha < 0.01) continue;
      const box = entryBox(lvl, i, phase, tt);
      const sc = scoreOf(lvl, i);
      const barH = Math.max(2, sc * 24);
      svg.appendChild(el('rect',{
        x: box.x + 1.5,
        y: box.y + box.h + 4,
        width: Math.max(2, box.w - 3),
        height: barH,
        rx: 2, ry: 2,
        fill: 'var(--score)',
        opacity: barAlpha*0.85,
      }));
    }
  }

  /* cells (top-down so coarser cells render last and stay readable) */
  for (let lvl = L-1; lvl >= 0; lvl--){
    const stroke = lvl===0?'var(--l0)' : lvl===1?'var(--l1)' : 'var(--l2)';
    for (let i=0;i<SIZES[lvl];i++){
      const a = entryAlpha(lvl, i, phase, tt);
      if (a < 0.01) continue;
      const box = entryBox(lvl, i, phase, tt);
      svg.appendChild(el('rect',{
        x: box.x, y: box.y, width: box.w, height: box.h,
        rx: 4, ry: 4,
        fill: fillFor(valueOf(lvl,i)),
        stroke: stroke, 'stroke-width': 1.2,
        opacity: a,
      }));
      const fontSize = box.w >= 50 ? 11 : box.w >= 30 ? 10 : 9;
      svg.appendChild(el('text',{
        x: box.x + box.w/2,
        y: box.y + box.h/2 + 3.6,
        'text-anchor':'middle',
        'font-size': fontSize,
        'font-family':'JetBrains Mono,Menlo,Consolas,monospace',
        fill: 'var(--ink)', opacity: a*0.95,
      }, String(globalIdx(lvl, i)+1)));
    }
  }

  /* selection rings (gold = selected/cascading; red = rejected) */
  for (let lvl=0; lvl<L; lvl++){
    for (let i=0;i<SIZES[lvl];i++){
      const status = statusOf(lvl, i);
      if (status === 'unused') continue;
      const a = ringAlpha(lvl, i, phase, tt);
      if (a < 0.01) continue;
      const box = entryBox(lvl, i, phase, tt);
      const color = status === 'selected' ? 'var(--pick)' : 'var(--reject)';
      svg.appendChild(el('rect',{
        x: box.x - 1.5, y: box.y - 1.5,
        width: box.w + 3, height: box.h + 3,
        rx: 5, ry: 5,
        fill:'none', stroke: color, 'stroke-width': 2.0,
        opacity: a*0.95,
      }));
    }
  }
}

/* ---------- playback ---------- */
let phase = 0, progress = 0, playing = false, lastT = 0, baseDur = 1700;

function setLabel(){
  const idx = Math.min(phase, PHASE_COUNT-1);
  titleEl.textContent = phases[idx].title + '  —  ' + phases[idx].sub;
  phaseEl.textContent = `phase ${idx+1} / ${PHASE_COUNT}`;
  const total = (phase + progress) / Math.max(1, PHASE_COUNT-1);
  meter.style.width = (Math.min(1, Math.max(0, total))*100).toFixed(1) + '%';
}
function render(){ draw(phase, progress); setLabel(); }

function step(dtMs){
  const sp = parseFloat(speedSel.value);
  progress += dtMs / (baseDur / sp);
  while (progress >= 1){
    if (phase < PHASE_COUNT-1){
      progress -= 1;
      phase++;
    } else {
      // hold on the final scene; user must press ↻ to replay
      progress = 1;
      playing = false;
      playBtn.textContent = '▶';
      break;
    }
  }
  render();
}
function tick(ts){
  if (!playing) return;
  if (!lastT) lastT = ts;
  const dt = ts - lastT; lastT = ts;
  step(dt);
  requestAnimationFrame(tick);
}
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸' : '▶';
  lastT = 0;
  if (playing) requestAnimationFrame(tick);
};
prevBtn.onclick    = () => { playing=false; playBtn.textContent='▶';
  if (progress>0.05) progress=0;
  else { phase = Math.max(0,phase-1); progress=0; } render(); };
nextBtn.onclick    = () => { playing=false; playBtn.textContent='▶';
  if (phase<PHASE_COUNT-1){ phase++; progress=0; } else progress=1; render(); };
restartBtn.onclick = () => { playing=false; playBtn.textContent='▶';
  phase=0; progress=0; render(); };

render();
</script>
</body>
</html>
